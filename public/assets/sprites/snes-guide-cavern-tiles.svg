<svg xmlns="http://www.w3.org/2000/svg" width="128" height="16" viewBox="0 0 128 16" shape-rendering="crispEdges">
  <rect width="128" height="16" fill="#0F0F0F"/>

  <!-- floor_base -->
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="16" height="16" fill="#3A0710"/>
