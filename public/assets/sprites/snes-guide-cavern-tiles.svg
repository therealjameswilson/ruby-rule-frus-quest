  </g>

  <!-- floor_scuff -->
  <g transform="translate(16 0)">
    <rect x="0" y="0" width="16" height="16" fill="#3A0710"/>
    <rect x="1" y="1" width="14" height="14" fill="#5A2E1D"/>
    <rect x="3" y="5" width="6" height="1" fill="#B89A5A"/>
