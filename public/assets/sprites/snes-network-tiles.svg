  </g>

  <!-- class_floor -->
  <g transform="translate(16 0)">
    <rect x="0" y="0" width="16" height="16" fill="#0F0F0F"/>
    <rect x="1" y="1" width="14" height="14" fill="#3A0710"/>
    <rect x="2" y="2" width="5" height="1" fill="#B82030"/>
