<svg xmlns="http://www.w3.org/2000/svg" width="128" height="16" viewBox="0 0 128 16" shape-rendering="crispEdges">
  <rect width="128" height="16" fill="none"/>

  <!-- floor_base -->
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="16" height="16" fill="#ead8a2"/>
    <rect x="0" y="0" width="16" height="1" fill="#fff3c8"/>
    <rect x="0" y="15" width="16" height="1" fill="#c9a65a"/>
    <rect x="3" y="4" width="3" height="1" fill="#d9bd77"/>
    <rect x="10" y="10" width="2" height="1" fill="#d9bd77"/>
  </g>

  <!-- floor_shadow -->
  <g transform="translate(16 0)">
    <rect x="0" y="0" width="16" height="16" fill="#d7bf7d"/>
    <rect x="0" y="0" width="16" height="2" fill="#ead8a2"/>
    <rect x="0" y="14" width="16" height="2" fill="#9a7635"/>
    <rect x="2" y="7" width="5" height="1" fill="#8a642d"/>
    <rect x="9" y="4" width="3" height="1" fill="#fff3c8"/>
  </g>

  <!-- floor_scuff -->
  <g transform="translate(32 0)">
    <rect x="0" y="0" width="16" height="16" fill="#ead8a2"/>
    <rect x="2" y="5" width="6" height="1" fill="#7b5930"/>
    <rect x="7" y="6" width="1" height="3" fill="#7b5930"/>
    <rect x="9" y="10" width="4" height="1" fill="#c9a65a"/>
    <rect x="4" y="12" width="1" height="1" fill="#8d1228"/>
  </g>

  <!-- rug_center -->
  <g transform="translate(48 0)">
    <rect x="0" y="0" width="16" height="16" fill="#6b0718"/>
    <rect x="0" y="0" width="16" height="2" fill="#b98a35"/>
    <rect x="0" y="14" width="16" height="2" fill="#b98a35"/>
    <rect x="3" y="5" width="2" height="2" fill="#a8182c"/>
    <rect x="10" y="8" width="2" height="2" fill="#a8182c"/>
  </g>

  <!-- rug_edge -->
  <g transform="translate(64 0)">
    <rect x="0" y="0" width="16" height="16" fill="#b98a35"/>
    <rect x="2" y="2" width="12" height="12" fill="#6b0718"/>
    <rect x="4" y="4" width="8" height="1" fill="#e6c878"/>
    <rect x="4" y="11" width="8" height="1" fill="#e6c878"/>
  </g>

  <!-- wall_top -->
  <g transform="translate(80 0)">
    <rect x="0" y="0" width="16" height="16" fill="#7b5930"/>
    <rect x="0" y="0" width="16" height="3" fill="#c9a65a"/>
    <rect x="0" y="13" width="16" height="3" fill="#3a2118"/>
    <rect x="3" y="5" width="10" height="2" fill="#9a7635"/>
    <rect x="4" y="9" width="7" height="1" fill="#ead8a2"/>
  </g>

  <!-- wall_bookcase -->
  <g transform="translate(96 0)">
    <rect x="0" y="0" width="16" height="16" fill="#3a2118"/>
    <rect x="1" y="1" width="14" height="14" fill="#7b5930"/>
    <rect x="3" y="3" width="2" height="10" fill="#8d1228"/>
    <rect x="6" y="3" width="2" height="10" fill="#b98a35"/>
    <rect x="9" y="3" width="2" height="10" fill="#304860"/>
    <rect x="12" y="3" width="1" height="10" fill="#ead8a2"/>
  </g>

  <!-- desk_top -->
  <g transform="translate(112 0)">
    <rect x="0" y="0" width="16" height="16" fill="#8a5a2e"/>
    <rect x="0" y="0" width="16" height="2" fill="#c9a65a"/>
    <rect x="0" y="14" width="16" height="2" fill="#3a2118"/>
    <rect x="3" y="5" width="7" height="5" fill="#ead8a2"/>
    <rect x="11" y="6" width="3" height="3" fill="#8d1228"/>
  </g>
</svg>
